name: Auto-approve Renovate (cron)
on:
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  id-token: write
jobs:
  approve:
    uses: ./.github/workflows/auto-approve-renovate.yml # self-reference at the caller's commit
