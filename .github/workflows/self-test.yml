# Exercises the composite actions under .github/actions/ directly from the
# working tree (via `./` paths) on every push/PR to k6-ci, validating action
# changes without an extra `.k6-ci` sparse-checkout step.

name: Self test
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      go_current: ${{ steps.go_versions.outputs.current }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Resolve Go versions
        id: go_versions
        uses: ./.github/actions/go-versions

  deps:
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.configure.outputs.go_current }}
          cache: false # against cache-poisoning
          check-latest: true
      - uses: ./.github/actions/deps

  lint:
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.configure.outputs.go_current }}
          cache: false # against cache-poisoning
          check-latest: true
      # No `ref` input — the action falls back to the in-tree .golangci.yml,
      # which on this PR is exactly the file we want to lint with.
      - uses: ./.github/actions/lint
