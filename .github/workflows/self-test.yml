# Exercises the composite actions under .github/actions/ from the local
# checkout (via `./` paths) on every push/PR to k6-ci, so action changes
# are validated before merge.
#
# all.yml uses `grafana/k6-ci/.github/actions/...@main` and therefore runs
# the merged version, not the PR's. This workflow fills that gap.
# See AGENTS.md ("Self-CI gap on action changes").

name: Self test
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      go_current: ${{ steps.go_versions.outputs.current }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve Go versions
        id: go_versions
        uses: ./.github/actions/go-versions

  deps:
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.configure.outputs.go_current }}
          cache: false # against cache-poisoning
          check-latest: true
      - uses: ./.github/actions/deps

  lint:
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.configure.outputs.go_current }}
          cache: false # against cache-poisoning
          check-latest: true
      # No `ref` input — the action falls back to the in-tree .golangci.yml,
      # which on this PR is exactly the file we want to lint with.
      - uses: ./.github/actions/lint
